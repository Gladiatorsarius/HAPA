name: HAPA
environment: development
debug: false
workspace_root: .
api:
  host: 0.0.0.0
  port: 8000
  log_level: INFO
  public_base_url: http://localhost:8000
auth:
  issuer_url: https://localhost/
  audience: hapa-api
  jwt_secret: development-only-change-me
  required_scopes:
    - hapa:read
    - hapa:write
    - hapa:approve
storage:
  database_url: sqlite:///artifacts/hapa.db
telemetry:
  event_retention_seconds: 86400
  sse_keepalive_seconds: 15
temporal:
  target: localhost:7233
  namespace: hapa
  workflow_queue: hapa-workflows
docker:
  socket_url: unix:///var/run/docker.sock
  network: hapa-network
  timeout_seconds: 30
  use_rootless: true
browser:
  headless: true
  screenshot_dir: artifacts/screenshots
llm:
  active_provider: anthropic
  strong_model: claude-3-5-sonnet-latest
  tier3_models:
    - claude-3-5-haiku-latest
    - gpt-4o-mini
    - gemini-2.0-flash
