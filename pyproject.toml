[project]
name = "hapa"
version = "0.2.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "docker>=7.2.0",
    "fastapi>=0.143.0",
    "gitpython>=3.2.0",
    "langgraph>=1.2.14",
    "opencv-python>=5.0.0.93",
    "playwright>=1.63.0",
    "pydantic>=2.14.0",
    "temporalio>=1.16.0",
    "uvicorn>=0.54.0",
]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "$version"
version_scheme = "pep440"
version_provider = "uv"
update_changelog_on_bump = true
major_version_zero = true
